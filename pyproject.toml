[project]
name = "lingua"
version = "0.1.0"
description = "Lingua - Language model training framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "omegaconf",
    "msgspec",
    "rouge-score",
    "sacrebleu",
    "sentencepiece",
    "tiktoken",
    "blobfile",
    "wandb",
    "viztracer",
    "lm-eval",
    "scipy",
    "pynvml",
    "datatrove",
    "orjson",
]

[project.optional-dependencies]
gpu = [
    "torch==2.7.0",
    "xformers",
]
enc-dec = [
    "datasets",
    "transformers",
]
dev = [
    "ninja",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
python-preference = "system"

[tool.uv.pip]
system = true
