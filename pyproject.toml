[project]
name = "lingua"
version = "0.1.0"
description = "Lingua - Language model training framework"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "omegaconf",
    "msgspec",
    "rouge-score",
    "sacrebleu",
    "sentencepiece",
    "tiktoken",
    "blobfile",
    "wandb",
    "viztracer",
    "lm-eval",
    "scipy",
    "nvidia-ml-py",
    "datatrove",
    "orjson",
    "torch==2.8.0",
    "xformers",
    "datasets",
    "transformers",
    "huggingface_hub",
    "ninja",
    "pip",
    "einops",
    "ray[default]",
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.3/flash_attn-2.7.3+cu12torch2.8cxx11abiTRUE-cp311-cp311-linux_x86_64.whl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.extra-build-dependencies]
xformers = ["torch"]
