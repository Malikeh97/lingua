[project]
name = "lingua"
version = "0.1.0"
description = "Lingua - Language model training framework"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "omegaconf",
    "msgspec",
    "rouge-score",
    "sacrebleu",
    "sentencepiece",
    "tiktoken",
    "blobfile",
    "wandb",
    "viztracer",
    "lm-eval",
    "scipy",
    "pynvml",
    "datatrove",
    "orjson",
    "torch==2.7.0",
    "xformers",
    "datasets",
    "transformers",
    "huggingface_hub",
    "ninja",
    "pip",
    "einops",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.extra-build-dependencies]
xformers = ["torch"]
