name: mvp_modernbert_pretrained_dec_300M
dump_dir: /home/ehghaghi/scratch/ehghaghi/mvp_modernbert_pretrained_dec_300M
max_epochs: 2
seed: 42
grad_acc_steps: 2
gc_collect_freq: 100
optim:
  lr: 1e-4
  weight_decay: 0.01
  warmup: 200
  lr_min_ratio: 0.01
  clip: 1.0
distributed:
  fsdp_type: no_shard
  compile: false
  model_dtype: bf16
  selective_activation_checkpointing: true
model:
  # Decoder dimension matches the pretrained 300M model
  dim: 960

  max_encoder_seqlen: 2048
  max_decoder_seqlen: 4096

  vocab_size: 128256
  weight_tying: false
  share_embeddings: false

  encoder_type: pretrained

  pretrained_encoder:
    model_name: answerdotai/ModernBERT-base
    encoder_dim: 768
    pooling: none
    use_flash_attention: true

  # Pretrained decoder from HuggingFace
  # Cross-attention layers will be randomly initialized since they don't exist in the HF model
  pretrained_decoder:
    model_name: Malikeh1375/nemotron_fineinstructions_1T_judged_exp_chat_300M
    freeze_pretrained: false  # All weights trainable

  # Encoder args (not used when encoder_type=pretrained)
  encoder:
    n_layers: 6
    n_heads: 12
    n_kv_heads: 12

  # Decoder architecture must match the pretrained model
  decoder:
    n_layers: 32
    n_heads: 15
    n_kv_heads: 5
    ffn_dim_multiplier: null
    multiple_of: 256
    norm_eps: 1e-5
    rope_theta: 100000.0
    init_std_factor: disabled

data:
  dataset_name: squad
  dataset_config: null
  dataset_split: train
  question_column: question
  answer_column: answers
  context_column: context
  max_encoder_len: 1024
  max_decoder_len: 256
  batch_size: 8
  seed: 42
  add_bos: true
  add_eos: true
  num_workers: 4
  prefetch_factor: 2
  val_split_ratio: 0.1  # Hold out 10% of training data for validation
  encoder_tokenizer_name: answerdotai/ModernBERT-base
  tokenizer:
    name: tiktoken
    path: /home/ehghaghi/projects/aip-craffel/ehghaghi/lingua/tokenizers/llama3_tiktoken_bpe_tokenizer/original/tokenizer.model
eval:
  every: 100  # Evaluate every 100 optimizer steps
  max_steps: null  # Use full validation set
checkpoint:
  dump:
    every: 500
    keep: 2
  eval:
    every: 500
    keep: 2
  path: /home/ehghaghi/scratch/ehghaghi/mvp_modernbert_pretrained_dec_300M/checkpoints
  init_ckpt_path: null
  consolidate: true
profiling:
  run: true
  trace_folder: profiling
  mem_warmup: 0
  mem_steps: 4
  profile_warmup: 100
  profile_steps: 4
logging:
  freq: 1
  acc_freq: null
  wandb: null
