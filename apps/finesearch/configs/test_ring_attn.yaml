# Ring attention test config
# 1 node × 4 GPUs, sp_size=4 (all GPUs in one sequence parallel group)

seed: 42

steps: 500
grad_acc_steps: 1
log_interval: 50
eval_interval: 250
gc_collect_freq: 100
run_val: false

data:
  sources:
    - task: fineinstructions
      weight: 1.0
      max_examples: 50000
  target_tokens: 32768
  batch_size: 16
  packer_buffer_size: 1000
  seed: 42
  doc_max_tokens: 32768
  target_max_tokens: 2048

optim:
  lr: 0.0002
  weight_decay: 0.01
  warmup: 100
  lr_min_ratio: 0.01
  clip: 1.0

distributed:
  fsdp_type: no_shard
  compile: false
  model_dtype: bf16
  sp_size: 4

checkpoint:
  dump:
    every: 250
    keep: 2

logging:
  freq: 50
  wandb:
    project: finesearch
    name: test_ring_attn
