# Multi-task training config for debug run
# Inherits model from debug.yaml
# Uses: config=debug.yaml,debug_multitask.yaml

seed: 42

# Training
steps: 10000
grad_acc_steps: 1
log_interval: 100
eval_interval: 1000
gc_collect_freq: 1000

# Data
data:
  sources:
    - task: squad
      weight: 0.4
    - task: hotpotqa
      weight: 0.3
    - task: fineinstructions
      weight: 0.3
      max_examples: 10000
      max_doc_tokens: 8192
  target_tokens: 8192
  batch_size: 16
  packer_buffer_size: 1000
  seed: 42
  doc_max_tokens: 8192
  target_max_tokens: 512

# Optimizer
optim:
  lr: 0.0003
  weight_decay: 0.01
  warmup: 500
  lr_min_ratio: 0.01
  clip: 1.0

# Distributed
distributed:
  fsdp_type: no_shard
  compile: false
  model_dtype: bf16

# Checkpointing
checkpoint:
  dump:
    every: 1000
    keep: 5

# Logging
logging:
  freq: 100
  wandb:
    project: finesearch
    name: debug_multitask
