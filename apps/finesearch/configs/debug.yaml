# Shared debug configuration for FineSearch encoder-decoder
# C/Q//A format (query_in_encoder=True): ModernBERT-base, 6-layer decoder
# Baseline reference: val/exact_match ~64.4 (C/Q//A, 150M, 6L, main.py)

name: finesearch_debug
dump_dir: outputs/finesearch_debug

# Model (shared between train and eval)
model:
  model_type: encdec
  encoder_name: answerdotai/ModernBERT-base
  freeze_encoder: false
  decoder_name: ""
  num_decoder_layers: 6
  cross_attn_layers: "all"
  cross_attn_heads: 8
  cross_attn_type: softmax
