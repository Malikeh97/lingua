# Multi-node training test config
# 2 nodes × 4 GPUs = 8 GPUs, FSDP full_shard

seed: 42

steps: 500
grad_acc_steps: 1
log_interval: 50
eval_interval: 250
gc_collect_freq: 100
run_val: false

data:
  sources:
    - task: squad
      weight: 1.0
  target_tokens: 8192
  batch_size: 16
  packer_buffer_size: 1000
  seed: 42
  doc_max_tokens: 512
  target_max_tokens: 128

optim:
  lr: 0.0002
  weight_decay: 0.01
  warmup: 100
  lr_min_ratio: 0.01
  clip: 1.0

distributed:
  fsdp_type: full_shard
  compile: false
  model_dtype: bf16

checkpoint:
  dump:
    every: 250
    keep: 2

logging:
  freq: 50
  wandb:
    project: finesearch
    name: test_multinode
